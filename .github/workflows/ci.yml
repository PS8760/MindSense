name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      - name: Ruff lint
        run: |
          ruff check src app tests scripts
          ruff format --check src app tests scripts || true

      - name: Pytest
        run: pytest tests -q

      - name: App import smoke test
        run: python -c "import app.home_smoke" 2>/dev/null || python scripts/smoke_app.py

      - name: Notebook smoke test (synthetic data)
        env:
          MINDSENSE_SYNTHETIC: "1"
        run: bash scripts/notebook_smoke.sh
