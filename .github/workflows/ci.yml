name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      - name: Ruff lint
        run: |
          ruff check src app tests scripts
          ruff format --check src app tests scripts || true

      - name: Pytest
        run: pytest tests -q

      - name: App import smoke test
        run: python -c "import app.home_smoke" 2>/dev/null || python scripts/smoke_app.py

      - name: Notebook smoke test (synthetic data)
        env:
          MINDSENSE_SYNTHETIC: "1"
        run: bash scripts/notebook_smoke.sh

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: mindsense:ci
          cache-from: type=gha,scope=mindsense
          cache-to: type=gha,scope=mindsense,mode=max

      - name: Report image size
        run: docker images mindsense:ci --format "{{.Repository}}:{{.Tag}} {{.Size}} ({{.ID}})"

      - name: Run container and probe health + page
        run: |
          docker run --rm -d --name mindsense -p 8501:7860 mindsense:ci
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8501/_stcore/health >/dev/null; then
              echo "health ok (try $i)"
              break
            fi
            sleep 2
          done
          curl -fsS -o /dev/null -w "page HTTP %{http_code}\n" http://localhost:8501
          docker stop mindsense
